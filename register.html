<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Daftar — Peternakan Hewan</title>
<link rel="stylesheet" href="css/style.css"/>
<script defer src="js/app.js"></script>
<script defer src="js/register.js"></script>
<style>
  .auth-wrap{max-width:520px;margin:0 auto;padding:16px}
  .auth-top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
  .brand h1{margin:0;font-size:28px;letter-spacing:.5px}
  .icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer}
  .auth-card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .field{display:grid;gap:6px;margin-bottom:12px}
  .input{width:100%;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:none;color:var(--text)}
  .btn{background:linear-gradient(135deg,var(--primary1),var(--primary2));color:#062133;border:none;padding:12px 14px;border-radius:12px;font-weight:800;cursor:pointer}
  .muted{color:var(--muted)}
  .links{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:60}
  .overlay.show{display:flex}
  .spinner{width:64px;height:64px;border-radius:50%;border:6px solid rgba(255,255,255,.2);border-top-color:#9fd4ff;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-top">
      <div class="brand"><h1>PETERNAKAN HEWAN</h1></div>
      <div style="display:flex;gap:12px">
        <div class="icon-btn" data-action="notif">🔔</div>
        <div class="icon-btn" data-action="lang">🌐</div>
      </div>
    </div>

    <div class="auth-card">
      <h2 style="margin:0 0 10px">Daftar</h2>
      <p class="muted" style="margin:0 0 12px">Buat akun baru untuk mulai.</p>
      <div class="field"><label>Nama</label><input id="name" class="input" placeholder="Nama kamu"/></div>
      <div class="field"><label>Email</label><input id="email" class="input" type="email" placeholder="nama@email.com"/></div>
      <div class="field"><label>Kata sandi</label><input id="password" class="input" type="password" placeholder="Minimal 6 karakter"/></div>
      <button id="register" class="btn">Buat akun</button>
      <div class="links"><a href="login.html"><b>Sudah punya akun? Masuk</b></a></div>
    </div>
  </div>

  <!-- Notif Modal -->
  <div class="modal" id="notif-modal">
    <div class="sheet">
      <h3>Notifikasi</h3>
      <ul id="notif-list" style="list-style:none;padding:0;margin:0"></ul>
      <div class="footer"><button class="btn secondary close-modal">Tutup</button></div>
    </div>
  </div>

  <!-- Lang Modal -->
  <div class="modal" id="lang-modal">
    <div class="sheet">
      <h3>Pilih bahasa</h3>
      <div class="row">
        <div class="pill" data-lang="id">Indonesia</div>
        <div class="pill" data-lang="en">English</div>
      </div>
      <div class="footer"><button class="btn secondary close-modal">Tutup</button></div>
    </div>
  </div>

  <div class="overlay" id="loading"><div class="spinner"></div></div>
</body>
</html>
